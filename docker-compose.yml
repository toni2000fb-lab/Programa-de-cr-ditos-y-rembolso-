services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creditos
      POSTGRES_PASSWORD: creditos
      POSTGRES_DB: creditos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditos -d creditos"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      # Sólo en localhost y en 5433 por defecto, para no chocar con un PostgreSQL local en 5432.
      # La app y los tests usan la red interna de Docker (db:5432), así que no dependen de este puerto.
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://creditos:creditos@db:5432/creditos?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-cambiar-en-produccion-0123456789}
      BUREAU_BASE_URL: http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Marca la app como "healthy" cuando /login responde. `docker compose ps` muestra si ya está lista.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      # Puerto del equipo configurable con APP_PORT si el 3000 está ocupado. Dentro del contenedor la app
      # sigue en 3000, por eso BUREAU_BASE_URL no cambia.
      - "${APP_PORT:-3000}:3000"

  # Ejecuta toda la suite (unitarios + integración contra PostgreSQL real):
  #   docker compose run --rm tests
  tests:
    build:
      context: .
      target: build
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://creditos:creditos@db:5432/creditos_test?schema=public
      SESSION_SECRET: test-secret-0123456789abcdef
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "test"]

volumes:
  pgdata:
