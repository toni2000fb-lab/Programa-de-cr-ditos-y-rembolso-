name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creditos
          POSTGRES_PASSWORD: creditos
          POSTGRES_DB: creditos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditos -d creditos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://creditos:creditos@localhost:5432/creditos_test?schema=public
      SESSION_SECRET: ci-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
