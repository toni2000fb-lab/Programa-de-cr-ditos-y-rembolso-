name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creditos
          POSTGRES_PASSWORD: creditos
          POSTGRES_DB: creditos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditos -d creditos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://creditos:creditos@localhost:5432/creditos_test?schema=public
      SESSION_SECRET: ci-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Levanta el proyecto igual que lo hará quien lo revise (`docker compose up --build`) y comprueba que
  # arranca de verdad: construye la imagen, aplica migraciones, siembra y responde.
  docker:
    name: docker (arranque real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar con Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: La pantalla de inicio responde
        run: curl -fsS -o /dev/null http://localhost:3000/login
      - name: La app no corre como root
        run: |
          uid="$(docker compose exec -T app id -u)"
          echo "uid del proceso: $uid"
          test "$uid" != "0"
      - name: Salen las cabeceras de seguridad
        run: |
          headers="$(curl -sI http://localhost:3000/login)"
          echo "$headers"
          echo "$headers" | grep -i '^x-frame-options: DENY'
          echo "$headers" | grep -i '^content-security-policy: .*frame-ancestors'
      - name: Se puede iniciar sesión por HTTP y la sesión funciona
        run: |
          curl -fsS -c jar.txt -X POST http://localhost:3000/api/auth/login \
            -H 'content-type: application/json' -d '{"userId":"u-ana-carla"}'
          curl -fsS -b jar.txt http://localhost:3000/api/budget
      - name: Diagnóstico si algo falló
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 100
      - name: Apagar
        if: always()
        run: docker compose down -v
